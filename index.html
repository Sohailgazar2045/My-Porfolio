    <meta name="description" content="Muhammad Sohail — Full Stack Developer in Lahore. 3+ years building web apps, backend systems, and AI-integrated automation across React, Next.js, Node, NestJS and FastAPI." />
    <meta name="theme-color" content="#0b0f19" />
    <script>
      (function () {
        try {
          var k = 'portfolio-theme';
          var t = localStorage.getItem(k);
          // Dark is the identity — default to it unless the visitor has
          // explicitly chosen light via the toggle.
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
